name: Windows network acceptance
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Windows test image
        type: choice
        default: windows-2022
        options:
          - windows-2022
          - windows-11-arm
permissions:
  contents: read
jobs:
  instance:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: false
      - name: Build the Mihomo instance matcher
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'mihomo-src'
          git clone --depth 1 --branch v1.19.34 https://github.com/MetaCubeX/mihomo.git $src
          if ($LASTEXITCODE -ne 0 -or (git -C $src rev-parse HEAD) -ne '0455d0d28c4526937380505153e65a843d8612e8') { exit 1 }
          git -C $src apply (Resolve-Path 'scripts/mihomo-process-instance.patch')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CGO_ENABLED = '0'
          $env:GOTOOLCHAIN = 'local'
          Push-Location $src
          try {
            go build -p 2 -tags with_gvisor -trimpath -o "$env:RUNNER_TEMP/mihomo-instance.exe" .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - name: Compare two instances of the same executable
        shell: pwsh
        run: python scripts/smoke-windows-process-instance.py "$env:RUNNER_TEMP/mihomo-instance.exe"
