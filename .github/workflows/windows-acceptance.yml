name: Windows network acceptance
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Windows test image
        type: choice
        default: windows-2022
        options:
          - windows-2022
          - windows-11-arm
permissions:
  contents: read
jobs:
  signed-driver:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 8
    steps:
      - name: Validate and load the signed Windows packet driver
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'xeyl-windivert'
          New-Item -ItemType Directory -Path $dir
          $zip = Join-Path $dir 'driver.zip'
          curl.exe --fail --location --silent --show-error --retry 2 --max-time 90 https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip -o $zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne '63cb41763bb4b20f600b6de04e991a9c2be73279e317d4d82f237b150c5f3f15') { throw 'Unexpected WinDivert download' }
          Expand-Archive $zip $dir
          $files = Join-Path $dir 'WinDivert-2.2.2-A/x64'
          $signature = Get-AuthenticodeSignature (Join-Path $files 'WinDivert64.sys')
          Write-Host "Driver signature: $($signature.Status)"
          if ($signature.Status -ne 'Valid') { throw 'The driver signature failed verification' }
          $env:XEYL_TEST_DRIVER_DLL = Join-Path $files 'WinDivert.dll'
          @'
          import ctypes as c
          import os
          driver = c.WinDLL(os.environ["XEYL_TEST_DRIVER_DLL"], use_last_error=True)
          driver.WinDivertOpen.argtypes = [c.c_char_p, c.c_int, c.c_int16, c.c_uint64]
          driver.WinDivertOpen.restype = c.c_void_p
          driver.WinDivertClose.argtypes = [c.c_void_p]
          handle = driver.WinDivertOpen(b"false", 0, 0, 1 | 4)
          if handle == c.c_void_p(-1).value:
              raise c.WinError(c.get_last_error())
          if not driver.WinDivertClose(handle):
              raise c.WinError(c.get_last_error())
          print("Windows accepted the signed kernel driver and closed the empty capture.")
          '@ | python -
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
