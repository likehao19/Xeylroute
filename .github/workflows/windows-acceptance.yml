name: Windows network acceptance
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Windows test image
        type: choice
        default: windows-2022
        options:
          - windows-2022
          - windows-11-arm
permissions:
  contents: read

jobs:
  windows:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: false
      - name: Prepare pinned network core
        run: npm run core
      - name: Verify live forwarding and application routing
        shell: pwsh
        run: |
          $target = ((rustc -vV | Select-String '^host: ').Line -split ' ')[1]
          $core = "src-tauri/binaries/xeylroute-mihomo-${target}.exe"
          python scripts/smoke-mihomo.py --binary $core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/smoke-routing.py $core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/smoke-windows-process-instance.py $core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/smoke-failure-fallback.py $core
      - name: Build frontend
        run: npm ci && npm run build
        shell: cmd
      - name: Test Windows desktop backend
        id: backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Exercise WinINet ownership and recovery on the disposable VM
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml wininet_takeover_and_recovery -- --ignored
      - name: Build the desktop application with embedded frontend
        id: desktop
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: cargo build --locked --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Verify selected software TUN in the Windows installer
        if: ${{ !cancelled() && steps.desktop.outcome == 'success' && inputs.runner == 'windows-2022' }}
        shell: pwsh
        run: |
          npm run desktop -- bundle --debug --ci --no-sign --bundles nsis
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $installer = @(Get-ChildItem src-tauri/target/debug/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          $installed = Join-Path $env:RUNNER_TEMP 'RoutePilot acceptance'
          $uninstaller = Join-Path $installed 'uninstall.exe'
          try {
            $setup = Start-Process $installer[0].FullName -ArgumentList "/S /D=$installed" -Wait -PassThru
            if ($setup.ExitCode) { throw "Installation failed: $($setup.ExitCode)" }
            foreach ($file in @('WinDivert.dll', 'WinDivert64.sys', 'licenses/WinDivert-LICENSE.txt', 'licenses/WinDivert-source.tar.gz')) {
              if (!(Test-Path (Join-Path $installed $file) -PathType Leaf)) { throw "Missing installed resource: $file" }
            }
            $sig = Get-AuthenticodeSignature (Join-Path $installed 'WinDivert64.sys')
            if ($sig.Status -ne 'Valid') { throw "WinDivert signature: $($sig.Status)" }
            python scripts/smoke-windows-process-tun.py (Join-Path $installed 'xeylroute-mihomo.exe')
            if ($LASTEXITCODE) { throw 'Selected software TUN smoke test failed' }
          } finally {
            if (Test-Path $uninstaller) {
              $remove = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
              if ($remove.ExitCode) { throw "Uninstall failed: $($remove.ExitCode)" }
              foreach ($file in @('routepilot-desktop.exe', 'xeylroute-mihomo.exe', 'WinDivert.dll')) {
                if (Test-Path (Join-Path $installed $file)) { throw "Uninstall left behind $file" }
              }
              $driver = Join-Path $installed 'WinDivert64.sys'
              if (Test-Path $driver) {
                $pending = @(Get-ItemPropertyValue 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue)
                $source = "\??\$driver"
                $queued = $false
                for ($i = 0; $i -lt $pending.Count; $i += 2) {
                  if ($pending[$i] -eq $source -and !$pending[$i+1]) { $queued = $true }
                }
                if (!$queued) { throw 'Uninstall left the driver file without scheduling its deletion' }
                Write-Host 'Uninstall queued the in-use driver file for deletion on restart.'
              } else {
                Write-Host 'Uninstall removed the driver file.'
              }
            }
          }
      - name: Exercise the TUN worker and check Windows route cleanup
        if: ${{ !cancelled() && steps.desktop.outcome == 'success' }}
        run: python scripts/smoke-windows-tun.py src-tauri/target/debug/routepilot-desktop.exe
      - name: Drive the native desktop controls and verify network recovery
        if: ${{ !cancelled() && steps.desktop.outcome == 'success' }}
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $installed = Get-ItemPropertyValue -Path "HKLM:\SOFTWARE\WOW6432Node\$client","HKCU:\SOFTWARE\$client" -Name pv -ErrorAction SilentlyContinue
          if (!($installed | Where-Object { $_ -and [version]$_ -gt [version]'0.0.0.0' })) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation,') { throw 'Unexpected WebView2 installer signature' }
            if ((Start-Process $installer -ArgumentList '/silent','/install' -Wait -PassThru).ExitCode) { throw 'WebView2 setup failed' }
          }
          node scripts/smoke-windows-desktop.mjs src-tauri/target/debug/routepilot-desktop.exe
  alternative-core:
    if: ${{ inputs.runner == 'windows-11-arm' }}
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compare per-program capture and instance matching in sing-box
        run: python scripts/smoke-windows-singbox.py
