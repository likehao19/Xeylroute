name: Windows network acceptance
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Windows test image
        type: choice
        default: windows-2022
        options:
          - windows-2022
          - windows-11-arm
permissions:
  contents: read
jobs:
  feasibility:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: npm run core
        shell: pwsh
      - name: Try binding only cURL to the TUN interface
        shell: pwsh
        run: |
          $target = ((rustc -vV | Select-String '^host: ').Line -split ' ')[1]
          python scripts/probe-network-policy.py "src-tauri/binaries/xeylroute-mihomo-${target}.exe"
